name: Gitleaks Full History Scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: linux-cpu
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete Git history with redacted output
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'
